name: Verify Lean 4.33.1 & Python/Wolfram Suites

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python scientific packages for asymptotic cross-checks
        run: pip install mpmath sympy

      - name: Install elan and Lean 4.33.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Run Wolfram Language package cross-validator
        run: python3 wolfram_submission/cross_validate_wl.py

      - name: Run 19-stage standalone Python verification suite
        run: python3 verify_all_theorems.py

      - name: Build all Lean 4.33.1 modules & run 60-second Trust-Zero Spec Check
        run: bash ./check_formal.sh
